[package]
name = "rml-cli"
description = "Command-line tool of the Runehaven Mac Launcher, for testing and troubleshooting."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "rml"
path = "src/main.rs"

[dependencies]
rml-core = { path = "../rml-core" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde_json.workspace = true
