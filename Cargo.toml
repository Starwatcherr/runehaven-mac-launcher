[workspace]
resolver = "2"
members = ["crates/rml-core", "crates/rml-cli", "crates/rml-app"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Starwatcherr"]
repository = "https://github.com/Starwatcherr/runehaven-launcher"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
