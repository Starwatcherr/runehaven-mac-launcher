[workspace]
resolver = "2"
members = ["crates/rhl-core", "crates/rhl-cli", "crates/rml-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Starwatcherr"]
repository = "https://github.com/Starwatcherr/runehaven-launcher"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
